# Keeps the CI actions and NuGet packages current: Dependabot opens one pull request per
# group each week, which CI then builds and tests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The Windows App SDK components move together with an official release; the weekly
    # Dependencies workflow (tools/check-windowsappsdk.ps1) reports a new one instead.
    ignore:
      - dependency-name: "Microsoft.WindowsAppSDK.*"
    groups:
      tests:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
