name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Windows App SDK components form one release
        run: ./tools/check-windowsappsdk.ps1
      - name: Test without changing the desktop or display topology
        run: dotnet test --project tests/Llampec.Core.Tests -c Release --filter-not-class Llampec.Tests.SystemActionTests --filter-not-class Llampec.Tests.HdrDisplaysTests --filter-not-class Llampec.Tests.ProjectionModesTests
      # Run locally on hardware; CI only keeps them compiling with Core.
      - name: Build the native smoke test and the Logitech probe
        run: |
          dotnet build tests/Llampec.AlwaysOnTop.Smoke -c Release
          dotnet build tools/Llampec.Logitech.Probe -c Release

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Package (${{ matrix.rid }})
        run: ./tools/package.ps1 -RuntimeIdentifier ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: Llampec-${{ matrix.rid }}
          path: publish/*.zip
          if-no-files-found: error
